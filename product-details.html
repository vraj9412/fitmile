<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Details - FitMile</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/x-icon" href="./assets/bag-check-fill.svg" />
    <style>
      :root {
        --primary: #1f2a44; /* Navy */
        --accent: #d4af37; /* Gold */
        --muted: #f4f5f7;
        --text: #0b1324;
      }
      html,
      body {
        font-family: Poppins, system-ui, -apple-system, Segoe UI, Roboto,
          "Helvetica Neue", Arial, sans-serif;
        color: var(--text);
      }
      .navbar {
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: saturate(180%) blur(12px);
      }
      .brand-mark {
        font-weight: 700;
        letter-spacing: 0.3px;
      }
      .brand-dot {
        color: var(--accent);
      }
      .product-img {
        max-height: 70%;
        width: 100%;
        object-fit: contain;
        background-position: center;
        border-radius: 12px;
      }

      .thumbnail-img {
        width: 60px;
        margin: 5px;
        cursor: pointer;
        border-radius: 8px;
        transition: border 0.3s;
      }

      .thumbnail-img:hover {
        border: 2px solid #007bff;
      }

      .product-title {
        font-size: 1.5rem;
      }

      .price {
        font-size: 1.3rem;
      }

      .size-option {
        display: inline-block;
        margin: 5px 8px 5px 0;
        padding: 6px 14px;
        border: 1px solid #ccc;
        border-radius: 8px;
        cursor: pointer;
        transition: background 0.3s ease;
      }

      .size-option:hover {
        background: #f0f0f0;
      }

      .color-circle {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        display: inline-block;
        margin: 5px;
        border: 2px solid #ccc;
        transition: border-color 0.3s;
        cursor: pointer;
      }

      .color-circle:hover {
        border-color: #007bff;
      }

      .detail-list {
        list-style: none;
        padding-left: 0;
        font-size: 0.9rem;
      }

      .detail-list li::before {
        content: "✓ ";
        color: green;
      }
      .btn-accent {
        background: var(--accent);
        color: #111;
      }
      .btn-accent:hover {
        filter: brightness(0.95);
        border: 1px solid var(--accent);
        color: var(--accent);
      }
      .fw-500 {
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <!-- ✅ Navbar -->
    <nav class="navbar navbar-expand-lg border-bottom sticky-top">
      <div class="container py-2">
        <a
          class="navbar-brand d-flex align-items-center gap-2"
          href="index.html"
        >
          <i class="bi bi-bag-check-fill" style="color: var(--accent)"></i>
          <span class="brand-mark"
            >FitMile<span class="brand-dot">.</span></span
          >
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link" href="index.html">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="products-list.html?audience=Men">Men</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="products-list.html?audience=Women"
                >Women</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link" href="about.html">About</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- ✅ Product Section -->
    <div class="container py-5" id="productContainer">
      <div class="row">
        <!-- Left: Image -->
        <div class="col-md-6 text-center">
          <img
            src=""
            alt="Product Image"
            class="product-img mb-3"
            id="mainImage"
          />
          <div id="thumbnails"></div>
        </div>

        <!-- Right: Details -->
        <div class="col-md-6">
          <h1 class="product-title" id="productTitle"></h1>
          <p class="text-muted" id="productDescription"></p>
          <h1 class="price mb-0" id="productPrice"></h1>
          <p style="font-size: 0.8rem; color: rgb(6, 196, 6); opacity: 0.8">
            Inclusive of all taxes
          </p>

          <div class="mt-3">
            <strong class="fw-500">Product Details:</strong>
            <ul class="detail-list mt-2" id="productDetailList"></ul>
          </div>

          <div class="mb-3">
            <strong class="fw-500">Available Sizes:</strong>
            <br />
            <div id="sizeOptions"></div>
          </div>

          <div class="mb-4">
            <strong class="fw-500">Color:</strong><br />
            <div id="colorOptions"></div>
          </div>

          <div class="mt-4 d-flex gap-3">
            <button class="btn btn-lg btn-accent">Visit Store</button>
          </div>
        </div>
      </div>
    </div>
    <!-- Footer -->
    <footer class="bg-dark text-white py-4 text-center mt-5">
      <div class="container">
        <p class="mb-0">&copy; 2025 FitMile. All rights reserved.</p>
      </div>
    </footer>
    <!-- ✅ Script -->
    <script>
      function getQueryParam(param) {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get(param);
      }

      function changeImage(src) {
        document.getElementById("mainImage").src = src;
      }

      const productName = getQueryParam("name");

      fetch("myntra_all_clean.json")
        .then((response) => response.json())
        .then((products) => {
          const product = products.find(
            (p) => p.name && p.name.trim() === productName?.trim()
          );
          if (product) {
            populateProduct(product);
          } else {
            document.getElementById("productContainer").innerHTML =
              "<h3>Product not found</h3>";
          }
        })
        .catch((error) => {
          console.error("Error loading JSON:", error);
          document.getElementById("productContainer").innerHTML =
            "<h3>Error loading product data</h3>";
        });

      function populateProduct(p) {
        // Main image
        document.getElementById("mainImage").src = p.image;

        // Title & desc
        document.getElementById("productTitle").innerText = p.name;
        document.getElementById("productDescription").innerText = p.description;
        document.getElementById("productPrice").innerText = "₹" + p.price;

        // Details
        const detailList = document.getElementById("productDetailList");
        detailList.innerHTML = "";
        if (Array.isArray(p.detail)) {
          p.detail.forEach((d) => {
            detailList.innerHTML += `<li>${d}</li>`;
          });
        }

        // Sizes
        const sizeContainer = document.getElementById("sizeOptions");
        sizeContainer.innerHTML = "";
        p.sizes.forEach((size) => {
          sizeContainer.innerHTML += `<span class="size-option">${size}</span>`;
        });

        // Colors
        const colorContainer = document.getElementById("colorOptions");
        colorContainer.innerHTML = "";
        p.colors.forEach((color) => {
          colorContainer.innerHTML += `<span class="color-circle" style="background-color:${color};"></span>`;
        });
      }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
